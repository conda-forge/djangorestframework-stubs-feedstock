schema_version: 1

context:
  name: djangorestframework-stubs
  version: "3.17.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5b67655090e2976b778bad572840b732a87ab2911402530d0dca2fbf72f891c5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.12.0,<0.13.0
  run:
    - python >=${{ python_min }}
    - django-stubs >=6.0.7
    - typing-extensions >=4.0
    - types-pyyaml

tests:
  - python:
      imports:
        - mypy_drf_plugin
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: PEP-484 stubs for django-rest-framework
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/typeddjango/djangorestframework-stubs

extra:
  recipe-maintainers:
    - thewchan
